# 保持 Render 免費方案的遊戲伺服器醒著（2026-10-25 使用者指示）。
# Render Free 閒置 15 分鐘沒有 HTTP 請求就休眠，下一個玩家要等約 1 分鐘喚醒、期間顯示「重新連線中」。
# 每 10 分鐘打一次 /health（伺服器）與首頁（網頁）。GitHub Actions 對公開 repo 免費；
# 注意：排程可能延遲幾分鐘，repo 60 天沒有活動時 GitHub 會自動停用排程（到 Actions 頁面按 Enable 即可恢復）。
# Render Free 每月 750 小時，單一服務 24 小時開著約 744 小時，剛好在額度內。
name: keep-alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 遊戲伺服器 /health
        run: |
          # 正在休眠時第一次請求要等伺服器喚醒（最多約 1 分鐘），所以給足時間並重試
          curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            https://mistwood-game-server.onrender.com/health
          echo
      - name: 網頁
        run: |
          curl --fail --silent --show-error --max-time 30 --retry 2 --retry-all-errors \
            --output /dev/null --write-out '%{http_code}\n' https://mistwood-blue.vercel.app/
